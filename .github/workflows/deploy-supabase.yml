name: Deploy Supabase backend

on:
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: Apply supabase/migrations to the linked project
        required: true
        default: false
        type: boolean
      deploy_functions:
        description: Deploy Edge Functions
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify deployment secrets
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing SUPABASE_ACCESS_TOKEN" && exit 1)
          test -n "$SUPABASE_PROJECT_REF" || (echo "Missing SUPABASE_PROJECT_REF" && exit 1)
          if [ "${{ inputs.apply_migrations }}" = "true" ]; then
            test -n "$SUPABASE_DB_PASSWORD" || (echo "Missing SUPABASE_DB_PASSWORD for migrations" && exit 1)
          fi

      - name: Apply database migrations
        if: ${{ inputs.apply_migrations }}
        shell: bash
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: Deploy Edge Functions
        if: ${{ inputs.deploy_functions }}
        shell: bash
        run: |
          supabase functions deploy ai-profiles --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy ai-health --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy ai-feature-config --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy ai-explain --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy ai-summarize --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy ai-generate-html --project-ref "$SUPABASE_PROJECT_REF"
